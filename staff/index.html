<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คิวรับบริการ · เจ้าหน้าที่ รพ.สต.บ้านหนองครกใต้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.app{max-width:820px}
.datebar{display:flex;gap:8px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.datebar input[type=date]{padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.datebar .sp{flex:1}
.datebar .stamp{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* แถบแจ้งเตือน */
.alert{display:flex;align-items:center;gap:11px;padding:11px 16px;background:var(--warnsoft);
  border-bottom:1px solid var(--line)}
.alert .bell{font-size:17px;flex:0 0 auto}
.alert b{font-size:13.5px;font-weight:600;color:var(--warn);display:block;line-height:1.35}
.alert small{font-size:11.5px;color:var(--ink2);display:block}
.alert button{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 13px;
  border-radius:9px;background:var(--warn);color:#fff}

/* แท็บ */
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;position:relative;font-size:13.5px;font-weight:600;color:var(--ink3);
  padding:12px 12px 10px;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;margin-left:5px;
  vertical-align:middle;font-variant-numeric:tabular-nums}

.filters{display:flex;gap:7px;padding:12px 16px 4px;flex-wrap:wrap}
.filters button{font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;background:var(--sunk);color:var(--ink3)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px 6px}
.tile{background:var(--card2);border-radius:11px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile small{font-size:10.5px;color:var(--ink3)}
.tile.hi{background:var(--brandsoft)} .tile.hi b{color:var(--brand2)}

/* หัวหมวด */
.gh{display:flex;align-items:center;gap:9px;padding:15px 16px 7px;background:var(--paper);
  position:sticky;top:0;z-index:2;border-top:1px solid var(--line)}
.gh .tag{font-family:"Noto Serif Thai",serif;font-weight:700;color:var(--acc);
  background:var(--accsoft);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.gh b{font-size:13.5px;font-weight:600}
.gh .n{margin-left:auto;font-size:11.5px;color:var(--ink3)}

/* แถวคิว */
.qrow{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-top:1px solid var(--line);background:var(--card)}
.qrow .time{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;width:46px;flex:0 0 auto;padding-top:2px}
.qrow .code{font-family:"Noto Serif Thai",serif;font-weight:700;font-size:14px;color:var(--acc);width:48px;flex:0 0 auto;padding-top:1px}
.qrow .who{flex:1;min-width:0}
.qrow .who b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.qrow .who small{font-size:11.5px;color:var(--ink3);display:block}
.qrow .memo{font-size:11.5px;color:var(--warn);background:var(--warnsoft);
  padding:3px 9px;border-radius:7px;display:inline-block;margin-top:5px}
.qrow.isnew{background:var(--warnsoft)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.acts button{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink2)}
.acts button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts button:disabled{opacity:.5}

/* ตาราง */
.tw{overflow-x:auto;padding:0 16px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;font-weight:700;color:var(--ink3);border-bottom:1.5px solid var(--line)}
tbody td{font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--card2)}
tfoot td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:0}
td.zero{color:var(--ink3)}

.card{margin:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--accsoft)}
.card .ch b{font-size:14px;font-weight:600;color:var(--acc)}
.card .ch .n{margin-left:auto;font-size:19px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 14px;font-size:13px}
.kv span{color:var(--ink2)} .kv b{font-weight:600;font-variant-numeric:tabular-nums}
.kv.sub{font-size:12.5px;color:var(--ink3)} .kv.sub span{color:var(--ink3)}
.sechead{padding:16px 16px 6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3)}
.login{max-width:340px;margin:0 auto;padding-top:12vh}
.soundbtn{font-size:16px;padding:4px 8px;border-radius:8px}
.soundbtn[aria-pressed="false"]{opacity:.35}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="ttl">คิวรับบริการ<span id="orgsub"></span></div>
    <div style="flex:1"></div>
    <button class="soundbtn" id="sound" aria-pressed="true" title="เสียงเตือนเมื่อมีนัดใหม่" hidden>🔔</button>
    <button class="textbtn" id="logout" hidden>ออกจากระบบ</button>
  </div>

  <!-- เข้าสู่ระบบ -->
  <div class="body" id="login">
    <div class="login">
      <h2 class="qhead">สำหรับเจ้าหน้าที่</h2>
      <p class="qsub">กรอกรหัสผ่านที่ตั้งไว้ใน Script Properties</p>
      <div class="field" id="w-key"><label for="key">รหัสผ่านเจ้าหน้าที่</label>
        <input id="key" type="password" autocomplete="current-password"><p class="err" hidden></p></div>
      <button class="cta" id="btnlogin">เข้าสู่ระบบ</button>
    </div>
  </div>

  <!-- หน้าหลัก -->
  <div id="main" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">

    <div class="errbar" id="errbar" hidden>
      <span>⚠︎</span>
      <span><b id="errtxt"></b><small>ข้อมูลที่เห็นอาจไม่เป็นปัจจุบัน อย่าเพิ่งสรุปว่าไม่มีคิว</small></span>
      <button id="errretry">ลองใหม่</button>
    </div>

    <div class="alert" id="alert" hidden>
      <span class="bell">🔔</span>
      <span><b id="alerttxt"></b><small id="alertsub"></small></span>
      <button id="alertgo">ดูรายการ</button>
    </div>

    <div class="datebar">
      <input type="date" id="date">
      <button class="textbtn" id="todaybtn">วันนี้</button>
      <div class="sp"></div>
      <span class="stamp" id="stamp"></span>
      <button class="textbtn" id="refresh">รีเฟรช</button>
    </div>

    <div class="tabs" id="tabs">
      <button data-t="now"  aria-selected="true">คิวรับบริการ</button>
      <button data-t="up"   aria-selected="false">นัดล่วงหน้า<span class="badge" id="badge" hidden>0</span></button>
      <button data-t="done" aria-selected="false">เสร็จสิ้น</button>
      <button data-t="sum"  aria-selected="false">สรุปยอด</button>
      <button data-t="off"  aria-selected="false">ปิดบริการ</button>
    </div>

    <div class="body" style="padding:0" id="pane"></div>
  </div>
</div>

<script src="../config.js"></script>
<script src="../assets/date-th.js"></script>
<script>
(function () {
'use strict';
var C = window.APP_CONFIG;
var D = C.DEPTS;                     /* เซิร์ฟเวอร์เขียนทับตอนเข้าสู่ระบบ */
var $ = function (id) { return document.getElementById(id); };
var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o || {}, String(k)); };
var dep = function (k) { return has(D, k) ? D[k] : null; };
var K_KEY = 'nkt_staff_key', K_SEEN = 'nkt_seen_upcoming', K_SND = 'nkt_sound';
var st = { key:'', date: bkkNow().date, tab:'now', filter:'all', range:7,
           items:[], upcoming:[], seen:{}, sound:true, first:true, timer:null, bound:false,
           closures:null,
           off: { dept:null, date: bkkNow().date, mode:'day', slots:{}, reason:'' } };

$('orgsub').textContent = C.ORG;
$('date').value = st.date;

function ls(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
  catch (e) { return null; }
}
try { st.seen = JSON.parse(ls(K_SEEN) || '{}') || {}; } catch (e) { st.seen = {}; }
st.sound = ls(K_SND) !== '0';

/* ---------------- API ---------------- */
function api(p){
  p.key = st.key;
  if (C.DEMO) return demo(p);
  return fetch(C.API_URL, { method:'POST', body: JSON.stringify(p) })
    .then(function(r){ return r.json(); })
    .catch(function(){ var e = new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ต');
                       e.code = 'NETWORK'; throw e; })
    .then(function(j){
      if (!j.ok){ var e = new Error(j.error || 'ระบบขัดข้อง'); e.code = j.code || 'ERROR'; throw e; }
      return j;
    });
}

/* ---------------- ข้อมูลตัวอย่างสำหรับโหมด DEMO ---------------- */
var T = bkkNow().date;
var DEMO_ROWS = [
  { id:'1', date:T, dept:'tm', slot:'09:00–10:00', queueNo:'ท-001', name:'บุญมี ทองใบ', service:'นวดไทย', tel:'0812345678', right:'บัตรทอง (UC)', note:'', status:'done' },
  { id:'2', date:T, dept:'dn', slot:'09:00–10:00', queueNo:'ฟ-001', name:'ณัฐพล ศรีมงคล', service:'ขูดหินปูน', tel:'0823456789', right:'ข้าราชการ', note:'', status:'done' },
  { id:'3', date:T, dept:'tm', slot:'10:00–11:00', queueNo:'ท-002', name:'สมหญิง ศรีสะอาด', service:'พอกเข่า', tel:'0834567890', right:'บัตรทอง (UC)', note:'ปวดเข่าซ้ายมา 2 สัปดาห์', status:'checkin' },
  { id:'4', date:T, dept:'dn', slot:'10:00–11:00', queueNo:'ฟ-002', name:'กนกวรรณ ใจดี', service:'อุดฟัน', tel:'0845678901', right:'ประกันสังคม', note:'', status:'booked' },
  { id:'5', date:T, dept:'tm', slot:'10:00–11:00', queueNo:'ท-003', name:'ประยูร แก้วมณี', service:'ประคบสมุนไพร', tel:'0856789012', right:'บัตรทอง (UC)', note:'', status:'noshow' },
  { id:'6', date:T, dept:'tm', slot:'11:00–12:00', queueNo:'ท-004', name:'วิไล พันธ์ดี', service:'อบสมุนไพร', tel:'0867890123', right:'ชำระเงินเอง', note:'', status:'booked' },
  { id:'7', date:T, dept:'dn', slot:'11:00–12:00', queueNo:'ฟ-003', name:'ธีรศักดิ์ นามวงศ์', service:'ถอนฟัน', tel:'0878901234', right:'บัตรทอง (UC)', note:'แพ้ยาเพนนิซิลลิน', status:'booked' },
  { id:'8', date:T, dept:'tm', slot:'13:30–14:30', queueNo:'ท-005', name:'สุนีย์ บุญเรือง', service:'รับยาสมุนไพร', tel:'0889012345', right:'บัตรทอง (UC)', note:'', status:'booked' },
  { id:'9', date:T, dept:'dn', slot:'15:00–16:00', queueNo:'ฟ-004', name:'ด.ช.ภูมิ รักเรียน', service:'เคลือบฟลูออไรด์', tel:'0890123456', right:'บัตรทอง (UC)', note:'มากับผู้ปกครอง', status:'cancelled' }
];
var DEMO_UP = [
  { id:'u1', date:addDays(T,1), dept:'dn', slot:'09:00–10:00', queueNo:'ฟ-001', name:'อำนวย ชัยสิทธิ์', service:'ตรวจสุขภาพช่องปาก', tel:'0812223344', right:'บัตรทอง (UC)', note:'', status:'booked' },
  { id:'u2', date:addDays(T,1), dept:'tm', slot:'10:00–11:00', queueNo:'ท-001', name:'จันทร์เพ็ญ สุขใจ', service:'นวดไทย', tel:'0823334455', right:'บัตรทอง (UC)', note:'ปวดบ่าและคอ', status:'booked' },
  { id:'u3', date:addDays(T,3), dept:'tm', slot:'09:00–10:00', queueNo:'ท-001', name:'สมพร มีทรัพย์', service:'พอกเข่า', tel:'0834445566', right:'ข้าราชการ', note:'', status:'booked' },
  { id:'u4', date:addDays(T,5), dept:'dn', slot:'14:00–15:00', queueNo:'ฟ-001', name:'ด.ญ.พิมพ์ ใจงาม', service:'เคลือบฟลูออไรด์', tel:'0845556677', right:'บัตรทอง (UC)', note:'', status:'booked' }
];
var DEMO_OFF = [
  { id:'c1', dept:'tm', date:addDays(T,2), slot:'', reason:'หมอไปราชการ' },
  { id:'c2', dept:'dn', date:addDays(T,4), slot:'14:00–15:00', reason:'ประชุมวิชาการ' }
];
function demo(p){
  return new Promise(function(res){ setTimeout(function(){
    if (p.action === 'config')
      res({ ok:true, depts:C.DEPTS, rights:C.RIGHTS, holidays:C.HOLIDAYS, org:C.ORG,
            allowSameDay:C.ALLOW_SAME_DAY, bookAheadDays:C.BOOK_AHEAD_DAYS, arriveBefore:C.ARRIVE_BEFORE });
    else if (p.action === 'board')
      res({ ok:true, date:p.date, today:T,
            items: DEMO_ROWS.filter(function(r){ return r.date === p.date; }),
            upcoming: DEMO_UP.slice() });
    else if (p.action === 'range'){
      var days = {};
      for (var i=0;i<31;i++){
        var k = addDays(p.to, -i); if (k < p.from) break;
        var h = 0; for (var j=0;j<k.length;j++) h = (h*31 + k.charCodeAt(j)) >>> 0;
        days[k] = {
          tm:{ total:4+h%5, booked:0, checkin:0, done:3+h%4, noshow:h%2, cancelled:(h>>2)%2 },
          dn:{ total:2+(h>>3)%4, booked:0, checkin:0, done:2+(h>>3)%3, noshow:(h>>4)%2, cancelled:0 }
        };
      }
      res({ ok:true, from:p.from, to:p.to, days:days });
    }
    else if (p.action === 'status'){ DEMO_ROWS.forEach(function(r){ if (r.id === p.id) r.status = p.status; }); res({ ok:true }); }
    else if (p.action === 'closures') res({ ok:true, items: DEMO_OFF.slice() });
    else if (p.action === 'close'){
      DEMO_OFF.push({ id:'c'+(DEMO_OFF.length+1), dept:p.dept, date:p.date,
                      slot:p.slot||'', reason:p.reason||'' });
      res({ ok:true, closed:true, cancelled:0, notified:0 });
    }
    else if (p.action === 'reopen'){
      for (var i=0;i<DEMO_OFF.length;i++) if (DEMO_OFF[i].id === p.id) { DEMO_OFF.splice(i,1); break; }
      res({ ok:true });
    }
    else res({ ok:true, pushed:true });
  }, 180); });
}

/* ---------------- เข้าสู่ระบบ ---------------- */
st.key = ls(K_KEY) || '';
if (C.DEMO) st.key = 'demo';

function loginErr(msg){
  var w = $('w-key'), p = w.querySelector('.err');
  w.classList.add('bad'); p.textContent = msg; p.hidden = false;
}
$('btnlogin').onclick = function(){
  var k = $('key').value.trim(); if (!k) return;
  var btn = this;
  st.key = k; btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
  api({ action:'board', date: st.date })
    .then(function(){ ls(K_KEY, k); enter(); })
    .catch(function(e){ loginErr(e.message); btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; });
};
$('key').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('btnlogin').click(); });
$('logout').onclick = function(){ try { localStorage.removeItem(K_KEY); } catch (e) {} location.reload(); };

function applyConfig(j){
  if (!j) return;
  if (j.depts && Object.keys(j.depts).length){ C.DEPTS = j.depts; D = j.depts; }
  if (j.rights) C.RIGHTS = j.rights;
  if (j.org){ C.ORG = j.org; $('orgsub').textContent = j.org; }
}
function enter(){
  $('login').hidden = true; $('main').hidden = false;
  $('logout').hidden = false; $('sound').hidden = false;
  $('sound').setAttribute('aria-pressed', st.sound ? 'true' : 'false');
  api({ action:'config' }).then(applyConfig).catch(function(){}).then(function(){
    loadAll();
    if (!st.timer) st.timer = setInterval(function(){ if (!document.hidden) loadAll(true); }, 60000);
    if (!st.bound){
      st.bound = true;
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) loadAll(true); });
    }
  });
}
function toLogin(msg){
  if (st.timer){ clearInterval(st.timer); st.timer = null; }
  try { localStorage.removeItem(K_KEY); } catch (e) {}
  st.key = '';
  $('main').hidden = true; $('login').hidden = false;
  $('logout').hidden = true; $('sound').hidden = true;
  $('btnlogin').disabled = false; $('btnlogin').textContent = 'เข้าสู่ระบบ';
  loginErr(msg);
}

/* เสียงเตือน — ใช้ AudioContext ตัวเดียวตลอด เบราว์เซอร์จำกัดจำนวนไว้ */
var AC = null;
$('sound').onclick = function(){
  st.sound = !st.sound; ls(K_SND, st.sound ? '1' : '0');
  this.setAttribute('aria-pressed', st.sound ? 'true' : 'false');
  if (st.sound) beep();
};
function beep(){
  if (!st.sound) return;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AC || AC.state === 'closed') AC = new Ctx();
    if (AC.state === 'suspended') AC.resume();
    [880, 1180].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * 0.16;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.16);
    });
  } catch (e) {}
}

/* ---------------- โหลดข้อมูล ---------------- */
function pad(n){ return ('0' + n).slice(-2); }
function hideErr(){ $('errbar').hidden = true; }
function showErr(e, quiet){
  if (e.code === 'STAFF_AUTH') return toLogin(e.message);
  $('errbar').hidden = false;
  $('errtxt').textContent = 'โหลดข้อมูลไม่สำเร็จ · ' + e.message;
  if (!quiet) $('pane').innerHTML = '<div class="empty">ยังโหลดข้อมูลไม่ได้ กดลองใหม่ด้านบน</div>';
}
$('errretry').onclick = function(){ hideErr(); loadAll(); };

function loadAll(quiet){
  if (!quiet) $('pane').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  api({ action:'board', date: st.date })
    .then(function(j){
      hideErr();
      st.items = j.items || [];
      var before = newOnes(st.upcoming).length;
      st.upcoming = j.upcoming || [];
      var after = newOnes(st.upcoming).length;
      if (!st.first && after > before) beep();
      st.first = false;
      var n = bkkNow();
      $('stamp').textContent = 'อัปเดต ' + pad(Math.floor(n.min / 60)) + ':' + pad(n.min % 60);
      renderAlert(); render();
    })
    .catch(function(e){ showErr(e, quiet); });
}
function newOnes(list){ return (list || []).filter(function(r){ return !st.seen[r.id]; }); }
function markSeen(){
  var keep = {}; st.upcoming.forEach(function(r){ keep[r.id] = 1; });
  st.seen = keep; ls(K_SEEN, JSON.stringify(keep));
}

/* ---------------- แสดงผล ---------------- */
var LABEL = { booked:['รอเรียก','wait'], checkin:['เช็คอินแล้ว','ok'],
              done:['เสร็จสิ้น','mute'], noshow:['ไม่มาตามนัด','bad'], cancelled:['ยกเลิก','mute'] };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

function qrow(r, opts){
  opts = opts || {};
  var d = dep(r.dept) || { name: r.dept },
      lab = (r.dept === 'cs' && r.status === 'booked') ? ['รอตรวจสอบ','wait'] : (LABEL[r.status] || ['-','mute']);
  var e = el('<div class="qrow"></div>');
  e.setAttribute('data-dept', r.dept);
  if (opts.isNew) e.classList.add('isnew');
  e.innerHTML =
    '<span class="time">' + esc(opts.showDate ? thShort(r.date) : String(r.slot).split('–')[0]) + '</span>' +
    '<span class="code">' + esc(r.queueNo) + '</span>' +
    '<span class="who"><b>' + esc(r.name) +
      (opts.isNew ? ' <span class="chip bad">ใหม่</span>' : '') +
      ' <span class="chip ' + lab[1] + '">' + lab[0] + '</span>' +
      (r.status === 'booked' && r.calledAt
        ? ' <span class="chip ok">เรียกแล้ว ' + esc(r.calledAt) + '</span>' : '') + '</b>' +
      '<small>' + esc(d.name) + ' · ' + esc(r.service) + '</small>' +
      '<small>' + esc(r.tel || '') + (r.right ? ' · ' + esc(r.right) : '') +
        (opts.showDate ? ' · ' + esc(r.slot) + ' น.' : '') + '</small>' +
      (r.note ? '<span class="memo">' + (r.dept === 'cs' ? '<b>ปัญหาที่ปรึกษา:</b> ' : '') + esc(r.note) + '</span>' : '') +
    '</span>';
  var who = e.querySelector('.who');
  if (opts.actions !== false){
    var acts = document.createElement('span'); acts.className = 'acts';
    function add(txt, status, pri){
      var b = document.createElement('button');
      b.textContent = txt; if (pri) b.className = 'pri';
      b.onclick = function(){
        b.disabled = true;
        var run = status === 'call' ? api({ action:'call', id:r.id })
                                    : api({ action:'status', id:r.id, status:status });
        run.then(function(res){
              if (status === 'call' && res && res.pushed === false)
                alert('บันทึกการเรียกคิวแล้ว แต่ส่งข้อความเข้า LINE ไม่สำเร็จ กรุณาเรียกด้วยเสียงด้วย');
              loadAll(true);
            })
            .catch(function(e2){ showErr(e2, true); b.disabled = false; });
      };
      acts.appendChild(b);
    }
    if (r.status === 'booked'){
      if (r.dept === 'cs'){
        add('อนุมัติ', 'done', true);
        add(r.calledAt ? 'เรียกซ้ำ' : 'เรียกคิว', 'call');
      } else {
        add(r.calledAt ? 'เรียกซ้ำ' : 'เรียกคิว', 'call', !r.calledAt);
        add('เช็คอิน', 'checkin');
      }
      add('ไม่มา', 'noshow');
    } else if (r.status === 'checkin'){
      add('เสร็จสิ้น', 'done', true); add('ไม่มา', 'noshow');
    } else if (r.status === 'done' || r.status === 'noshow'){
      add('ย้อนกลับเป็นรอเรียก', 'booked');
    }
    if (acts.children.length) who.appendChild(acts);
  }
  return e;
}

function render(){
  var P = $('pane'); P.innerHTML = '';
  if (st.tab === 'now')  return renderNow(P);
  if (st.tab === 'up')   return renderUp(P);
  if (st.tab === 'done') return renderDone(P);
  if (st.tab === 'sum')  return renderSum(P);
  if (st.tab === 'off')  return renderOff(P);
}

/* --- แท็บ 5 · ปิดบริการ / วันหยุด --- */
function renderOff(P){

  if (!o.dept || !dep(o.dept)) o.dept = Object.keys(D)[0];
  var d = dep(o.dept);

    f.appendChild(b);
  });
  P.appendChild(f);

  var card = el('<div class="card" data-dept="' + o.dept + '">' +

    '<div style="padding:14px">' +
      '<div class="field"><label>วันที่ต้องการปิด</label><input type="date" id="offdate"></div>' +
      '<p class="label" style="margin-top:4px">ปิดแบบไหน</p>' +
      '<div class="filters" id="offmode" style="padding:0 0 10px"></div>' +

      '<div class="field" style="margin-top:12px"><label>เหตุผล (ไม่บังคับ · คนไข้จะเห็นข้อความนี้)</label>' +
        '<input id="offreason" maxlength="120" placeholder="เช่น หมอไปราชการ"></div>' +
      '<button class="cta" id="offbtn">ปิดให้บริการ</button>' +
    '</div></div>');
  P.appendChild(card);

  var dt = card.querySelector('#offdate');
  dt.value = o.date; dt.min = bkkNow().date;
  dt.onchange = function(){ o.date = isYmd(this.value) ? this.value : bkkNow().date; o.slots = {}; render(); };

  var mode = card.querySelector('#offmode');
  [['day','ปิดทั้งวัน'],['slot','เลือกเฉพาะบางช่วง']].forEach(function(m){
    var b = document.createElement('button');
    b.textContent = m[1];
    b.setAttribute('aria-pressed', o.mode === m[0] ? 'true' : 'false');
    b.onclick = function(){ o.mode = m[0]; render(); };

  });

  var sl = card.querySelector('#offslots');
  if (o.mode === 'slot'){
    var grid = el('<div class="slots"></div>');
    d.slots.forEach(function(x){
      var b = document.createElement('button');
      b.className = 'slot';

      b.innerHTML = '<b>' + esc(x) + '</b><small>' + (o.slots[x] ? 'จะปิด' : 'แตะเพื่อเลือก') + '</small>';
      b.onclick = function(){ o.slots[x] = !o.slots[x]; render(); };
      grid.appendChild(b);
    });
    sl.appendChild(grid);
  } else {
    sl.appendChild(el('<p class="qsub" style="margin:0">ทุกช่วงเวลาของวันนี้จะถูกปิด และคนไข้จะเห็นวันนั้นเป็น “ปิด”</p>'));
  }

  var rs = card.querySelector('#offreason');
  rs.value = o.reason;
  rs.oninput = function(){ o.reason = this.value; };

  card.querySelector('#offbtn').onclick = function(){
    var btn = this;
    var list = o.mode === 'day' ? [''] : Object.keys(o.slots).filter(function(k){ return o.slots[k]; });
    if (!list.length) return alert('กรุณาเลือกช่วงเวลาที่ต้องการปิดอย่างน้อย 1 ช่วง');
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
    closeRun(list, false)
      .then(function(res){
        var need = res.filter(function(r){ return r.j.needConfirm; });
        if (!need.length) return res;
        var lines = [];
        need.forEach(function(r){
          (r.j.items || []).forEach(function(it){
            lines.push('  ' + it.queueNo + ' ' + it.name + ' (' + it.slot + ')');
          });
        });
        var total = need.reduce(function(a, r){ return a + r.j.affected; }, 0);
        if (!confirm('มีคิวที่จองไว้แล้ว ' + total + ' รายการในช่วงที่จะปิด\n\n' +
                     lines.join('\n') + '\n\n' +
                     'ยืนยันปิดบริการ? ระบบจะยกเลิกคิวเหล่านี้และส่งข้อความแจ้งคนไข้ทาง LINE ทันที'))
          throw new Error('ยกเลิกการปิดบริการ');
        btn.textContent = 'กำลังปิดและแจ้งคนไข้…';
        return closeRun(list, true);
      })
      .then(function(res){
        var c = res.reduce(function(a, r){ return a + (r.j.cancelled || 0); }, 0);
        var n = res.reduce(function(a, r){ return a + (r.j.notified || 0); }, 0);
        alert('ปิดบริการเรียบร้อย' + (c ? '\nยกเลิกคิว ' + c + ' รายการ · แจ้งคนไข้สำเร็จ ' + n + ' รายการ' : ''));

    api({ action:'closures' })

/** ยิงคำสั่งปิดทีละช่วง แล้วรวมผลลัพธ์ */
function closeRun(list, force){
  var o = st.off;
  return list.reduce(function(chain, slot){
    return chain.then(function(acc){
      return api({ action:'close', dept:o.dept, date:o.date, slot:slot,
                   reason:o.reason, cancelExisting: !!force })
        .then(function(j){ acc.push({ slot: slot, j: j }); return acc; });
    });
  }, Promise.resolve([]));
}

      box.innerHTML = '<div class="empty"></div>';

function rangeTable(days){
  var keys = Object.keys(days || {}).sort().reverse();
  if (!keys.length) return '<div class="empty">ไม่มีข้อมูลในช่วงที่เลือก</div>';
  var dk = Object.keys(D), tot = {};
  dk.forEach(function(k){ tot[k] = 0; });
  var tDone = 0, tNo = 0, tAll = 0;
  var body = keys.map(function(d){
    var row = days[d] || {}, done = 0, no = 0, sum = 0;
    var cells = dk.map(function(k){
      var v = (row[k] && row[k].total) || 0;
      tot[k] += v; sum += v;
      done += (row[k] && row[k].done) || 0;
      no   += (row[k] && row[k].noshow) || 0;
      return '<td' + (v ? '' : ' class="zero"') + '>' + (v || '–') + '</td>';
    }).join('');
    tDone += done; tNo += no; tAll += sum;
    return '<tr><td>' + esc(thDate(d)) + ' <small style="color:var(--ink3)">' + DAY_S[dow(d)] + '</small></td>' +
      cells + '<td><b>' + sum + '</b></td><td>' + done + '</td><td' + (no ? '' : ' class="zero"') + '>' + (no || '–') + '</td></tr>';
  }).join('');
  return '<table><thead><tr><th>วันที่</th>' +
    dk.map(function(k){ return '<th>' + esc(D[k].name) + '</th>'; }).join('') +
    '<th>รวม</th><th>เสร็จสิ้น</th><th>ไม่มา</th></tr></thead><tbody>' + body +
    '</tbody><tfoot><tr><td>รวมทั้งช่วง</td>' +
    dk.map(function(k){ return '<td>' + tot[k] + '</td>'; }).join('') +
    '<td>' + tAll + '</td><td>' + tDone + '</td><td>' + tNo + '</td></tr></tfoot></table>';
}

/* ---------------- เริ่มทำงาน ---------------- */
if (st.key) enter();
})();
</script>
